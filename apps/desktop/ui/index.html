<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDE Gestor</title>
  <style>
    body {
      background-color: #0b0f17;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .btn {
      margin-top: 16px;
      padding: 10px 24px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2 style="margin: 0 0 8px 0; font-size: 20px;">Carregando IDE Gestor...</h2>
  <p id="msg" style="color: #94a3b8; max-width: 420px; font-size: 14px; margin: 0;">Conectando ao servidor seguro...</p>
  <button id="retry" class="btn" style="display:none;" onclick="location.href='https://gestor.suporteide.digital?app=true'">Tentar Novamente</button>
  <script>
    setTimeout(function() {
      var isAndroid = /android/i.test(navigator.userAgent);
      var platform = isAndroid ? "android" : "desktop";
      window.location.href = "https://gestor.suporteide.digital?app=true&platform=" + platform;
    }, 50);
    setTimeout(function() {
      document.getElementById('msg').innerText = "Não foi possível conectar ao servidor. Verifique sua conexão com a internet.";
      document.getElementById('retry').style.display = "inline-block";
    }, 6000);
  </script>
</body>
</html>
