name: Deploy Gestor IDE to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-gestor-ide
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH and Deploy to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '161.97.108.92' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          eval "$(ssh-agent -s)"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -

          ssh -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER"@"$VPS_HOST" <<'REMOTE'
          set -e
          PROJECT_DIR="/opt/gestor-ide"

          if [ ! -d "$PROJECT_DIR" ]; then
            git clone https://github.com/idedigitalbr/gestor-ide.git "$PROJECT_DIR"
          fi

          cd "$PROJECT_DIR"
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

          docker compose up -d --build --remove-orphans
          REMOTE
