name: Release Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do Release (ex: v0.1.7)'
        required: false
        default: 'v0.1.7'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK Environment
        shell: bash
        run: |
          echo "Configurando caminhos do Android SDK e NDK pré-instalados..."
          ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          
          # Encontrar a versão mais recente do NDK disponível no runner
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            echo "Instalando NDK 26 via sdkmanager..."
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
            NDK_PATH="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          fi
          
          echo "NDK localizado em: $NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          
          # Aceitar todas as licenças do SDK automaticamente
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Rust Toolchain for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Monorepo Dependencies
        run: bun install

      - name: Initialize Android Target in Tauri
        shell: bash
        run: |
          cd apps/desktop
          bun run tauri android init --ci --skip-targets-install

      - name: Patch MainActivity for Android Hardware & Gesture Back Button
        shell: bash
        run: |
          MAIN_ACTIVITY="apps/desktop/src-tauri/gen/android/app/src/main/java/digital/suporteide/gestor/MainActivity.kt"
          if [ -f "$MAIN_ACTIVITY" ]; then
            echo "Aprimorando MainActivity.kt com interceptador de retorno do Android..."
            cat << 'EOF' > "$MAIN_ACTIVITY"
          package digital.suporteide.gestor

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.view.KeyEvent
          import android.webkit.WebView
          import app.tauri.plugin.TauriActivity

          class MainActivity : TauriActivity() {
              private var webViewInstance: WebView? = null

              override fun onWebViewCreate(webView: WebView) {
                  webViewInstance = webView
                  super.onWebViewCreate(webView)
              }

              @SuppressLint("MissingSuperCall")
              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  handleBackAction()
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      handleBackAction()
                      return true
                  }
                  return super.onKeyDown(keyCode, event)
              }

              private fun handleBackAction() {
                  val wv = webViewInstance
                  if (wv != null) {
                      wv.evaluateJavascript(
                          "(function() { try { if (window.__handleAndroidBack && window.__handleAndroidBack()) { return true; } } catch (e) {} return false; })()"
                      ) { result ->
                          val handled = result == "true" || result == "\"true\""
                          if (!handled) {
                              runOnUiThread {
                                  if (wv.canGoBack()) {
                                      wv.goBack()
                                  } else {
                                      finish()
                                  }
                              }
                          }
                      }
                  } else {
                      finish()
                  }
              }
          }
          EOF
            echo "MainActivity.kt atualizado com sucesso!"
          else
            echo "::warning::MainActivity.kt nao encontrado em: $MAIN_ACTIVITY"
          fi

      - name: Build Android APK
        shell: bash
        run: |
          cd apps/desktop
          # Compilar o APK Release universal/aarch64
          bun run tauri android build --apk --target aarch64

      - name: Sign & Publish APK to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          echo "Buscando APK gerado para o release $TAG..."
          
          # Localizar arquivo .apk gerado pelo Gradle
          UNSIGNED_APK=$(find apps/desktop/src-tauri/gen/android -name "*.apk" | head -n 1)
          
          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::Nenhum arquivo .apk encontrado no diretório de build!"
            exit 1
          fi
          
          echo "APK não assinado encontrado em: $UNSIGNED_APK"
          DEST_NAME="ide-gestor-${TAG}.apk"
          
          # Localizar ferramentas Android build-tools (zipalign e apksigner)
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Utilizando Android build-tools: $BUILD_TOOLS"
          
          # 1. Alinhar o APK (zipalign de 4 bytes obrigatório antes da assinatura v2/v3)
          echo "Executando zipalign..."
          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" aligned.apk
          
          # 2. Criar chave criptográfica oficial para assinatura
          echo "Gerando keystore de assinatura oficial..."
          keytool -genkeypair -v -keystore release.jks -alias idegestor -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass idegestor123 -keypass idegestor123 \
            -dname "CN=IDE Gestor, OU=Mobile, O=IDE Digital, L=Sao Paulo, ST=SP, C=BR"
          
          # 3. Assinar o APK com apksigner (esquemas v1, v2 e v3 para compatibilidade total com todos os Androids)
          echo "Assinando APK com apksigner..."
          $BUILD_TOOLS/apksigner sign --ks release.jks --ks-pass pass:idegestor123 \
            --ks-key-alias idegestor --key-pass pass:idegestor123 \
            --out "$DEST_NAME" aligned.apk
          
          # 4. Verificar se a assinatura é válida
          echo "Verificando integridade da assinatura..."
          $BUILD_TOOLS/apksigner verify -v "$DEST_NAME"
          
          # 5. Publicar o APK 100% assinado e instalável na Release do GitHub
          echo "Fazendo upload de $DEST_NAME para a Release $TAG no GitHub..."
          gh release upload "$TAG" "$DEST_NAME" --clobber
          echo "Upload do APK assinado e verificado concluído com sucesso!"
